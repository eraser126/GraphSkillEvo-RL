# Integration template only. Replace the explicit pins after provisioning BenchFlow.
# Preflight validates editor schema; it does not assert these runtime paths exist.
schema_version: 1
backend: command
variant: full
fixed_semantic_judge: false
device: cpu
group_size: 4
updates: 4
max_context: 8192
max_new_tokens: 512
timeout: 1800
runner_argv:
  - /root/miniconda3/bin/python
  - -m
  - graphskillevo.editor.skillsbench
  - --request
  - '{request}'
  - --response
  - '{response}'
  - --checkout
  - /root/autodl-tmp/skillsbench
  - --commit
  - REPLACE_WITH_FIXED_40_CHARACTER_COMMIT
  - --bench-bin
  - /root/autodl-tmp/benchflow-venv/bin/bench
  - --bench-version
  - REPLACE_WITH_EXACT_BENCH_VERSION_OUTPUT
  - --agent
  - REPLACE_WITH_FIXED_AGENT
  - --worker-model
  - REPLACE_WITH_FIXED_WORKER_MODEL
  - --sandbox
  - docker
  - --allow-run
